    // Mapa com o nome de cada cor e o hexadecimal correspondente, usado para colorir as fatias dos graficos
    let cores = {
        "vermelho": "#e26b6b",
        "laranja": "#f39a5e",
        "amarelo": "#f1c85e",
        "verde": "#6abd7c",
        "azul": "#7e87df",
        "roxo": "#b97dd3"
    };

    // Função que retorna o hexadecimal da cor informada pelo nome, usada nas fatias dos graficos
    function obterCor(corNome) {
        return cores[corNome] || corNome;
    }

    function atualizarGraficoEscolhas(dados) {
    graficoEscolha.data.labels = dados.map(function (item) { return item.cor; });
    graficoEscolha.data.datasets[0].data = dados.map(function (item) { return item.percentual; });
    graficoEscolha.data.datasets[0].backgroundColor = dados.map(function (item) { return obterCor(item.cor); });
    graficoEscolha.update();
}

    function buscarEscolhas() { //ERRO QUE PAREI NO DIA 22/11/2026
    fetch('/dashboard/graficoEscolha')
        .then(function (resposta) { return resposta.json(); })
        .then(function (dados) { atualizarGraficoEscolhas(dados); })
        .catch(function (error) { console.error(`Erro na obtenção das escolhas: ${error.message}`); });
    }

    // Atualiza o grafico de identificacao com os dados recebidos
    function atualizarGraficoIdentificacoes(dados) {
        graficoIdentificacao.data.labels = dados.map(function (item) { return item.cor; });
        graficoIdentificacao.data.datasets[0].data = dados.map(function (item) { return item.percentual; });
        graficoIdentificacao.data.datasets[0].backgroundColor = dados.map(function (item) { return obterCor(item.cor); });
        graficoIdentificacao.update();
    }

    // Busca as identificacoes por cor e atualiza o grafico de identificacao
    function buscarIdentificacoes() {
        fetch('/dashboard/graficoIdentificacao')
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) { atualizarGraficoIdentificacoes(dados); })
            .catch(function (error) { console.error(`Erro na obtenção das identificacoes: ${error.message}`); });
    }

    // Busca os KPIs da dashboard e atualiza os valores na tela
    function buscarKpis() {
        // KPI 1 - Mais escolhida: busca a cor mais escolhida no cadastro
        fetch('/dashboard/kpiMaisEscolhida')
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) { atualizarValorKpiMaisEscolhida(dados); })
            .catch(function (error) { console.error(`Erro na obtenção do KPI mais escolhida: ${error.message}`); });

        // KPI 2 - Total de escolhas: busca o total geral de escolhas (total de usuários)
        fetch('/dashboard/kpiTotalEscolhas')
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) { atualizarValorKpiTotalEscolhas(dados); })
            .catch(function (error) { console.error(`Erro na obtenção do total de escolhas: ${error.message}`); });

        // KPI 3 - Total de respostas: busca o total geral de respostas ao formulário
        fetch('/dashboard/kpiTotalRespostas')
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) { atualizarValorKpiTotalRespostas(dados); })
            .catch(function (error) { console.error(`Erro na obtenção do total de respostas: ${error.message}`); });

        // KPI 4 - Maior identificação: busca a cor com a maior identificação
        fetch('/dashboard/kpiMaiorIdentificacao')
            .then(function (resposta) { return resposta.json(); })
            .then(function (dados) { atualizarValorKpiMaiorIdentificacao(dados); })
            .catch(function (error) { console.error(`Erro na obtenção do maior identificacao: ${error.message}`); });
    }

    // Atualiza o valor do KPI 1 - Mais escolhida com o nome da cor e a cor correspondente
    function atualizarValorKpiMaisEscolhida(dados) {
        var cor = dados[0].cor;
        var valor = document.getElementById("valorKpiMaisEscolhida");
        valor.innerHTML = cor.charAt(0).toUpperCase() + cor.slice(1);
        valor.style.color = obterCor(cor);
    }

    // Atualiza o valor do KPI 2 - Total de escolhas com o total vindo do banco
    function atualizarValorKpiTotalEscolhas(dados) {
        document.getElementById("valorKpiTotalEscolhas").innerHTML = dados[0].total;
    }

    // Atualiza o valor do KPI 3 - Total de respostas com o total vindo do banco
    function atualizarValorKpiTotalRespostas(dados) {
        document.getElementById("valorKpiTotalRespostas").innerHTML = dados[0].total;
    }

        valor.innerHTML = cor.charAt(0).toUpperCase() + cor.slice(1);
        valor.style.color = obterCor(cor);
    }
